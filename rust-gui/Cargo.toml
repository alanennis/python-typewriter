[package]
name = "typewriter-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "typewriter for a line printer, in a window"
license = "MIT"

[[bin]]
name = "typewriter-gui"
path = "src/main.rs"

[dependencies]
# the typewriter itself (buffer, margins, printers, config, bell) is shared
# with the terminal version in ../rust
typewriter = { path = "../rust" }
clap = { version = "4.5", features = ["derive"] }
# 0.32 is the newest eframe that builds on rust 1.85. wayland and x11 are
# both on by default; winit picks wayland when it's running
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[profile.release]
strip = true
lto = true

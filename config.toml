width = 75
autoreturn = true
spacing_index = 0 # 1.5 line spacingi, 0 for single line, 2 for double line
margin_bell = 9 # numbers of spaces from left margin to bell
bell = true # false switches off the margin bell and error beeps (alt-b toggles it)
bell_sound = "ding25.wav" # sound played at the margin bell, any wav/ogg file; "" for the terminal beep
right_margin = 62 # set the distance to the right margin
left_margin = 0
use_file = true
use_printer = true
save_folder = "/home/alane/Dropbox/writing/"
printer_vendor_id = 0x04b8 # USB vendor id of the printer (find with lsusb)
printer_product_id = 0x0047 # USB product id of the printer
#printer = "zebra" # which printer to use: "epson" (dot matrix) or "zebra" (thermal)
printer = "epson" # which printer to use: "epson" (dot matrix) or "zebra" (thermal)
# zebra settings (only used when printer = "zebra")
# zebra_device = "/dev/usb/lp0" # leave out to find it automatically
zebra_continuous = true # true ignores label gaps and prints straight across them (also right for gapless rolls)
zebra_upright = false # false prints upside down so torn-off strips read in order
zebra_darkness = 10 # 0 (lightest) to 30 (darkest), leave out to use the printer's setting
# zebra_char_dots = 12 # width of one column on the paper in dots (203 per inch); sets where the margins land
zebra_font = "/usr/share/fonts/truetype/roboto/unhinted/RobotoCondensed-Regular.ttf"
# zebra_font_size = 32 # leave out to match the built-in font's height

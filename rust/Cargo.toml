[package]
name = "typewriter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "typewriter for a line printer"
license = "MIT"

[[bin]]
name = "typewriter"
path = "src/main.rs"

[[bin]]
name = "zebra-lines"
path = "src/bin/zebra_lines.rs"

[dependencies]
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
rusb = "0.9"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
